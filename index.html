<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texts</title>
  <style>
    /* ---- réglages de base ---- */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: rgb(245, 245, 247);
      margin: 0;
    }

    main {
      margin: 24px auto 0;
      max-width: 600px;
    }

    main h1 {
      color: #263445;
      text-align: center;

    }

    .exercise-list {
      list-style: none;
      padding: 0;
    }


    .exercise-list li {
      margin-bottom: 12px;
    }

    .exercise-list a {
      display: block;
      padding: 16px 20px;
      background-color: #f4f6f8;
      color: #263445;
      text-decoration: none;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .exercise-list a:hover {
      background-color: #e8f0fe;
      border-color: #4285f4;
      color: #1a73e8;
      transform: translateX(5px);
    }

    .exercise-list a:focus-visible {
      outline: 3px solid #4285f4;
      outline-offset: 3px;
    }
  </style>
</head>

  <main>
